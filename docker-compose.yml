version: '3.8'
services:
  backend:
    build: .
    container_name: lemming_backend
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - SUBSTRATE_AUTH_TOKEN=LEMMING_GATEWAY_8080
      - ADVERSARIAL_OVERRIDE_KEY=LEMMING_SECRET_422
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - lemming_net
  frontend:
    image: nginx:alpine
    container_name: lemming_cockpit
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - lemming_net

networks:
  lemming_net:
    driver: bridge
